name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Test Suite
        run: mvn clean verify -B

      - name: Run In-Memory Microbenchmark
        run: java -jar target/reverse-proxy-rate-limiter-1.0.0.jar bench-memory --requests 500000 --threads 8
