name: CI

on:
  push:
    branches: [ main, master, prod-hardening ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Lint
        run: mvn clean compile -B -DcompilerArgument=-Xlint:all

      - name: Run Test Suite with JaCoCo Coverage
        run: mvn verify -B

      - name: Run In-Memory Microbenchmark
        run: java -jar target/reverse-proxy-rate-limiter-1.0.0.jar bench-memory --requests 100000 --threads 4

      - name: Build Docker Image
        run: docker build -t reverse-proxy-rate-limiter:test .

      - name: Smoke Test Docker Image
        run: docker run --rm reverse-proxy-rate-limiter:test --help
